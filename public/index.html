<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        
        <!-- Formulário para Enviar Pontuação -->
        <section class="form-section">
            <h2>Game Data Mining</h2>
            <form id="scoreForm">
                <div class="input-group">
                    <label for="playerName">Nome do Jogador:</label>
                    <input type="text" id="playerName" placeholder="Ex: Player1" required>
                </div>
                <div class="input-group">
                    <label for="playerScore">Pontuação:</label>
                    <input type="number" id="playerScore" placeholder="Ex: 2500" required>
                </div>
                <button type="submit">Registrar Pontuação</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <!-- Tabela de Classificação -->
        <section class="leaderboard-section">
            <h2>Top Enemies</h2>
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Enemy</th>
                        <th>Dangerousness</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Os dados da API vão entrar aqui via JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
